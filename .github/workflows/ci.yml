name: CI

on:
  push:
    branches: [main, acceptance]
  pull_request:

jobs:
  quality:
    name: Code style, statische analyse en tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # intl: IntlDateFormatter (periode-labels); gd: PDF-iconbadges
          extensions: intl, gd
          coverage: none

      - name: Composer-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer install
        run: composer install --no-interaction --no-scripts --prefer-dist

      - name: Code style (php-cs-fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Statische analyse (PHPStan, level max)
        run: |
          php bin/websiteconsole cache:warmup --env=dev
          vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Tests (PHPUnit)
        run: vendor/bin/phpunit
