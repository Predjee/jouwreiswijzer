name: 🚀 Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rollback_release:
        description: 'Rollback naar release (YYYYMMDDHHMMSS) — leeg laten voor een gewone deploy'
        required: false

jobs:
  deploy:
    if: github.event.inputs.rollback_release == ''
    uses: ./.github/workflows/deploy.yml
    with:
      app_env: prod
      base_path: /home/derei1602/production
      domain_path: /home/derei1602/domains/jouwreiswijzer.nl
    secrets:
      APP_SECRET: ${{ secrets.PROD_APP_SECRET }}
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      MAILER_DSN: ${{ secrets.PROD_MAILER_DSN }}
      SULU_ADMIN_EMAIL: ${{ secrets.PROD_SULU_ADMIN_EMAIL }}
      DEFAULT_URI: ${{ secrets.PROD_DEFAULT_URI }}
      NOTIFICATION_EMAIL: ${{ secrets.PROD_NOTIFICATION_EMAIL }}
      FROM_EMAIL: ${{ secrets.PROD_FROM_EMAIL }}
      JWT_PASSPHRASE: ${{ secrets.PROD_JWT_PASSPHRASE }}
      PUSH_VAPID_PUBLIC_KEY: ${{ secrets.PROD_PUSH_VAPID_PUBLIC_KEY }}
      PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PROD_PUSH_VAPID_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}

  rollback:
    if: github.event.inputs.rollback_release != ''
    uses: ./.github/workflows/rollback.yml
    with:
      base_path: /home/derei1602/production
      domain_path: /home/derei1602/domains/jouwreiswijzer.nl
      rollback_release: ${{ github.event.inputs.rollback_release }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
