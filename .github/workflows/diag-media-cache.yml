name: 🩺 Zoek oude releases met var/storage inhoud
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} -t rsa ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 🔎 Check alle release-mappen op inhoud in var/storage
        run: |
          REMOTE="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          BASE=/home/derei1602/production
          {
            echo "== beschikbare releases (nieuw naar oud) =="
            ssh -p ${{ secrets.DEPLOY_PORT }} "$REMOTE" "ls -1t '$BASE/releases' 2>&1"

            echo ""
            echo "== var/storage inhoud per release =="
            for rel in $(ssh -p ${{ secrets.DEPLOY_PORT }} "$REMOTE" "ls -1t '$BASE/releases' 2>&1"); do
              echo "--- release $rel ---"
              ssh -p ${{ secrets.DEPLOY_PORT }} "$REMOTE" "find '$BASE/releases/$rel/var/storage' -type f 2>/dev/null | wc -l"
            done

            echo ""
            echo "== eventuele backup-mappen elders op de server =="
            ssh -p ${{ secrets.DEPLOY_PORT }} "$REMOTE" "find /home/derei1602 -maxdepth 3 -iname '*backup*' 2>/dev/null"
          } > DIAG_OUTPUT.md 2>&1
          cat DIAG_OUTPUT.md

      - name: 📝 Commit resultaat terug
        run: |
          git config user.name "diag-bot"
          git config user.email "noreply@example.com"
          git add DIAG_OUTPUT.md
          git commit -m "diag: zoek naar intacte var/storage in oude releases" || echo "niets om te committen"
          git push origin HEAD:${{ github.ref_name }}
