name: 🩺 Diagnose media cache (production)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} -t rsa ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 🔎 Bevestig var/storage symlink
        run: |
          REMOTE="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          BASE=/home/derei1602/production
          {
            echo "== var/ in de huidige release (moet storage nu als symlink tonen) =="
            ssh -p ${{ secrets.DEPLOY_PORT }} "$REMOTE" "ls -la '$BASE/current/var/' 2>&1"
            echo ""
            echo "== shared/var/ (moet nu ook storage bevatten) =="
            ssh -p ${{ secrets.DEPLOY_PORT }} "$REMOTE" "ls -la '$BASE/shared/var/' 2>&1"
          } > DIAG_OUTPUT.md 2>&1
          cat DIAG_OUTPUT.md

      - name: 📝 Commit diagnose-output terug
        run: |
          git config user.name "diag-bot"
          git config user.email "noreply@example.com"
          git add DIAG_OUTPUT.md
          git commit -m "diag: bevestig var/storage symlink" || echo "niets om te committen"
          git push origin HEAD:${{ github.ref_name }}
