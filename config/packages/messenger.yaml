framework:
    messenger:
        transports:
            # Eigen, geïsoleerde transport voor push-berichten.
            # Geen permanente worker: de consumer wordt periodiek kort gestart
            # via een cronjob (messenger:consume push_messages --time-limit=...).
            # Zie ARCHITECTURE.md sectie 16a.
            push_messages:
                dsn: 'doctrine://default?queue_name=push_messages'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2

        routing:
            App\PushMessage\SendPushMessage: push_messages
