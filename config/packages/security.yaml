security:
    access_decision_manager:
        strategy: unanimous
        allow_if_all_abstain: true

    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        sulu:
            id: sulu_security.user_provider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        app_api_login:
            pattern: ^/api/app/login$
            stateless: true
            provider: sulu
            json_login:
                check_path: api_app_login
                username_path: email
                password_path: password
                success_handler: App\Security\AppLoginSuccessHandler
                failure_handler: App\Security\AppLoginFailureHandler
        app_api:
            pattern: ^/api/app
            stateless: true
            provider: sulu
            jwt: ~
        admin:
            pattern: ^/admin(\/|$)
            lazy: true
            context: sulu
            provider: sulu
            entry_point: sulu_security.authentication_entry_point
            json_login:
                check_path: sulu_admin.login_check
                success_handler: sulu_security.authentication_handler
                failure_handler: sulu_security.authentication_handler
            logout:
                path: sulu_admin.logout
            two_factor:
                prepare_on_login: true
                prepare_on_access_denied: true
                check_path: 2fa_login_check_admin
                authentication_required_handler: sulu_security.two_factor_authentication_required_handler
                success_handler: sulu_security.two_factor_authentication_success_handler
                failure_handler: sulu_security.two_factor_authentication_failure_handler

        website:
            pattern: ^/
            lazy: true
            context: sulu
            provider: sulu
            form_login:
                login_path: account_login
                check_path: account_login
                default_target_path: account
                enable_csrf: true
            logout:
                path: account_logout
                target: account_login
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/app/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/app, roles: ROLE_SULU_CUSTOMER }
        - { path: ^/admin/reset, allow_if: "not is_granted('ROLE_SULU_CUSTOMER')" }
        - { path: ^/admin/security/reset, allow_if: "not is_granted('ROLE_SULU_CUSTOMER')" }
        - { path: ^/admin/login$, allow_if: "not is_granted('ROLE_SULU_CUSTOMER')" }
        - { path: ^/admin/2fa, allow_if: "not is_granted('ROLE_SULU_CUSTOMER')" }
        - { path: ^/admin/_wdt, allow_if: "not is_granted('ROLE_SULU_CUSTOMER')" }
        - { path: ^/admin/_profiler, allow_if: "not is_granted('ROLE_SULU_CUSTOMER')" }
        - { path: ^/admin/translations, allow_if: "not is_granted('ROLE_SULU_CUSTOMER')" }
        - { path: ^/admin$, allow_if: "not is_granted('ROLE_SULU_CUSTOMER')" }
        - { path: ^/admin/$, allow_if: "not is_granted('ROLE_SULU_CUSTOMER')" }
        - { path: ^/admin/p/, allow_if: "not is_granted('ROLE_SULU_CUSTOMER')" }
        - { path: ^/admin, allow_if: "is_granted('ROLE_USER') and not is_granted('ROLE_SULU_CUSTOMER')" }
        - { path: ^/account/login$, roles: PUBLIC_ACCESS }
        - { path: ^/account/forgot-password$, roles: PUBLIC_ACCESS }
        - { path: ^/account/reset/, roles: PUBLIC_ACCESS }
        - { path: ^/account, roles: ROLE_SULU_CUSTOMER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon

        access_decision_manager:
            strategy: affirmative

        providers:
            sulu:
                id: test_user_provider

        firewalls:
            admin:
                http_basic:
                    provider: sulu
