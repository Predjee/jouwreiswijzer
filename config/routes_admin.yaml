travel_request.get_collection:
    path: /admin/api/travel-requests
    controller: App\Controller\Admin\TravelRequestController::cgetAction
    methods: [GET]
    defaults:
        _format: json

travel_request.get:
    path: /admin/api/travel-requests/{id}
    controller: App\Controller\Admin\TravelRequestController::getAction
    methods: [GET]
    defaults:
        _format: json

travel_request.put:
    path: /admin/api/travel-requests/{id}
    controller: App\Controller\Admin\TravelRequestController::putAction
    methods: [PUT]
    defaults:
        _format: json

travel_request_plan.get:
    path: /admin/api/travel-request-plans/{id}
    controller: App\Controller\Admin\TravelRequestController::getPlanAction
    methods: [GET]
    defaults:
        _format: json

travel_request_plan.put:
    path: /admin/api/travel-request-plans/{id}
    controller: App\Controller\Admin\TravelRequestController::putPlanAction
    methods: [PUT]
    defaults:
        _format: json

travel_request_plan.generate_pdf:
    path: /admin/api/travel-request-plans/{id}/generate-pdf
    controller: App\Controller\Admin\TravelPlanPdfController::generateForRequest
    methods: [POST]
    defaults:
        _format: json
    options:
        expose: true

travel_request_plan.release_pdf:
    path: /admin/api/travel-request-plans/{id}/release-pdf
    controller: App\Controller\Admin\TravelPlanPdfController::releaseForRequest
    methods: [POST]
    defaults:
        _format: json
    options:
        expose: true

travel_plan.generate_pdf:
    path: /admin/api/travel-plans/{id}/generate-pdf
    controller: App\Controller\Admin\TravelPlanPdfController::generate
    methods: [POST]
    defaults:
        _format: json
    options:
        expose: true

travel_plan.pdf_download:
    path: /admin/api/travel-plans/{id}/pdf/download
    controller: App\Controller\Admin\TravelPlanPdfController::download
    methods: [GET]
    defaults:
        _format: binary

travel_plan_feedback.put_status:
    path: /admin/api/travel-plan-feedback/{id}/status
    controller: App\Controller\Admin\TravelPlanFeedbackController::putStatusAction
    methods: [PUT]
    defaults:
        _format: json

travel_request_plan.notify_feedback_processed:
    path: /admin/api/travel-request-plans/{id}/notify-feedback-processed
    controller: App\Controller\Admin\TravelPlanFeedbackController::notifyProcessedForRequest
    methods: [POST]
    defaults:
        _format: json
    options:
        expose: true

